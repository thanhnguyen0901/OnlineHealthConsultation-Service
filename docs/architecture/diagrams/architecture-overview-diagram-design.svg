  <path class="arrow" d="M 324 286 H 380"/>
  <rect class="label-bg" x="334" y="270" width="36" height="16" rx="3"/>
  <text class="label" x="352" y="282" text-anchor="middle">uses</text>

  <path class="arrow-link" d="M 656 246 H 772"/>
  <rect class="label-bg" x="690" y="230" width="58" height="16" rx="3"/>
  <text class="label" x="719" y="242" text-anchor="middle">REST /api</text>

  <path class="arrow-bidi" d="M 616 224 H 668 V 124 H 1136 V 208"/>
  <rect class="label-bg" x="792" y="108" width="168" height="16" rx="3"/>
  <text class="label" x="876" y="120" text-anchor="middle">Socket.IO /consultations</text>

  <path class="arrow" d="M 886 292 V 336"/>
  <path class="arrow-soft" d="M 1136 292 V 332 H 1024 V 450 H 1016"/>
  <path class="arrow-soft" d="M 990 596 V 544 H 1146 V 450 H 1140"/>
  <path class="arrow" d="M 1018 692 V 804"/>
  <path class="arrow-soft" d="M 906 842 V 886"/>
  <path class="arrow-soft" d="M 1084 432 V 368 H 1350 V 772"/>
  <path class="arrow-dash" d="M 1016 450 H 1022 V 544 H 1472 V 914 H 1452"/>
  <rect class="label-bg" x="1384" y="530" width="50" height="16" rx="3"/>
  <text class="label" x="1409" y="542" text-anchor="middle">optional</text>

  <!-- Users -->
  <rect class="node" x="96" y="172" width="196" height="48" rx="6"/>
  <text class="text" x="194" y="201" text-anchor="middle">Guest</text>
  <rect class="node" x="96" y="236" width="196" height="48" rx="6"/>
  <text class="text" x="194" y="265" text-anchor="middle">Patient</text>
  <rect class="node" x="96" y="300" width="196" height="48" rx="6"/>
  <text class="text" x="194" y="329" text-anchor="middle">Doctor</text>
  <rect class="node" x="96" y="364" width="196" height="48" rx="6"/>
  <text class="text" x="194" y="393" text-anchor="middle">Administrator</text>

  <!-- Web Client -->
  <rect class="node-strong" x="420" y="204" width="196" height="88" rx="6"/>
  <text class="text" x="518" y="240" text-anchor="middle">React SPA</text>
  <text class="mono" x="518" y="264" text-anchor="middle">Vite / browser app</text>
  <rect class="node-optional" x="444" y="314" width="148" height="34" rx="6"/>
  <text class="mono" x="518" y="336" text-anchor="middle">Vercel hosting</text>

  <!-- Application internals -->
  <rect class="zone" x="752" y="144" width="532" height="172" rx="8"/>
  <rect class="zone-label-mask" x="794" y="138" width="118" height="20" rx="4"/>
  <text class="eyebrow" x="853" y="153" text-anchor="middle">ENTRY POINTS</text>
  <rect class="node-strong" x="792" y="208" width="188" height="84" rx="6"/>
  <text class="text" x="886" y="242" text-anchor="middle">REST Controllers</text>
  <text class="mono" x="886" y="266" text-anchor="middle">global prefix /api</text>
  <rect class="node-focal" x="1040" y="208" width="192" height="84" rx="6"/>
  <text class="text" x="1136" y="242" text-anchor="middle">ConsultationGateway</text>
  <text class="mono" x="1136" y="266" text-anchor="middle">Socket.IO namespace</text>

  <rect class="zone" x="752" y="348" width="532" height="188" rx="8"/>
  <rect class="zone-label-mask" x="794" y="342" width="168" height="20" rx="4"/>
  <text class="eyebrow" x="878" y="357" text-anchor="middle">APPLICATION MODULES</text>

  <rect class="module" x="780" y="384" width="112" height="36" rx="6"/>
  <text class="small" x="836" y="407" text-anchor="middle">Identity</text>
  <rect class="module" x="904" y="384" width="112" height="36" rx="6"/>
  <text class="small" x="960" y="407" text-anchor="middle">Doctor</text>
  <rect class="module" x="1028" y="384" width="112" height="36" rx="6"/>
  <text class="small" x="1084" y="407" text-anchor="middle">Patient</text>
  <rect class="module" x="1152" y="384" width="104" height="36" rx="6"/>
  <text class="small" x="1204" y="407" text-anchor="middle">Appointment</text>

  <rect class="module" x="780" y="432" width="112" height="36" rx="6"/>
  <text class="small" x="836" y="455" text-anchor="middle">Question</text>
  <rect class="module" x="904" y="432" width="112" height="36" rx="6"/>
  <text class="small" x="960" y="455" text-anchor="middle">Consultation</text>
  <rect class="module" x="1028" y="432" width="112" height="36" rx="6"/>
  <text class="small" x="1084" y="455" text-anchor="middle">Notification</text>
  <rect class="module" x="1152" y="432" width="104" height="36" rx="6"/>
  <text class="small" x="1204" y="455" text-anchor="middle">Reporting</text>

  <rect class="module" x="780" y="480" width="112" height="36" rx="6"/>
  <text class="small" x="836" y="503" text-anchor="middle">Specialty</text>
  <rect class="module" x="904" y="480" width="112" height="36" rx="6"/>
  <text class="small" x="960" y="503" text-anchor="middle">Discovery</text>
  <rect class="module" x="1028" y="480" width="112" height="36" rx="6"/>
  <text class="small" x="1084" y="503" text-anchor="middle">Operations</text>
  <rect class="module" x="1152" y="480" width="104" height="36" rx="6"/>
  <text class="small" x="1204" y="503" text-anchor="middle">Moderation</text>

  <rect class="zone" x="752" y="560" width="532" height="96" rx="8"/>
  <rect class="zone-label-mask" x="794" y="554" width="178" height="20" rx="4"/>
  <text class="eyebrow" x="883" y="569" text-anchor="middle">BACKGROUND PROCESSING</text>
  <rect class="node" x="848" y="596" width="284" height="36" rx="6"/>
  <text class="text" x="990" y="619" text-anchor="middle">NotificationScheduler</text>
  <text class="mono" x="1184" y="619" text-anchor="middle">node-cron</text>

  <!-- Data Layer -->
  <rect class="node-focal" x="792" y="804" width="228" height="76" rx="6"/>
  <text class="text" x="906" y="836" text-anchor="middle">PrismaService</text>
  <text class="mono" x="906" y="860" text-anchor="middle">Prisma ORM</text>
  <rect class="node-store" x="792" y="892" width="228" height="54" rx="6"/>
  <text class="text" x="906" y="925" text-anchor="middle">PostgreSQL</text>

  <!-- External boundaries -->
  <rect class="node-external" x="1248" y="772" width="204" height="68" rx="6"/>
  <text class="text" x="1350" y="802" text-anchor="middle">Email / SMS</text>
  <text class="mono" x="1350" y="824" text-anchor="middle">Provider Boundary</text>
  <rect class="node-optional" x="1248" y="880" width="204" height="68" rx="6"/>
  <text class="text" x="1350" y="910" text-anchor="middle">Video</text>
  <text class="mono" x="1350" y="932" text-anchor="middle">Provider Boundary</text>

  <!-- Semantic labels -->
  <text class="tiny" x="72" y="1004">Current state only: one NestJS runtime, modular monolith, PostgreSQL via Prisma, no Redis/message broker/vendor-specific provider in source.</text>
</svg>
