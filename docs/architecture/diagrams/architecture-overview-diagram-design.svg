<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Online Health Consultation Architecture Overview</title>
  <desc id="desc">High-level architecture diagram for the current Online Health Consultation modular monolith system.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e5aa8"/>
    </marker>
    <style>
      .paper { fill: #f5f5f5; }
      .title { fill: #2d3142; font: 400 34px Georgia, 'Times New Roman', serif; }
      .subtitle { fill: #4f5d75; font: 400 15px Arial, sans-serif; }
      .eyebrow { fill: #7a8399; font: 600 11px Arial, sans-serif; letter-spacing: 2px; }
      .zone { fill: rgba(45,49,66,0.02); stroke: rgba(45,49,66,0.12); stroke-width: 1; }
      .zone-label-mask { fill: #f5f5f5; }
      .node { fill: #ffffff; stroke: #bfc0c0; stroke-width: 1.2; }
      .node-strong { fill: #ffffff; stroke: #2d3142; stroke-width: 1.2; }
      .node-focal { fill: rgba(235,108,54,0.08); stroke: #eb6c36; stroke-width: 1.4; }
      .node-store { fill: rgba(45,49,66,0.05); stroke: #4f5d75; stroke-width: 1.2; }
      .node-external { fill: rgba(45,49,66,0.03); stroke: rgba(45,49,66,0.30); stroke-width: 1.2; }
      .node-optional { fill: rgba(45,49,66,0.02); stroke: rgba(45,49,66,0.28); stroke-width: 1.1; stroke-dasharray: 5 4; }
      .module { fill: #ffffff; stroke: rgba(79,93,117,0.45); stroke-width: 1; }
      .text { fill: #2d3142; font: 600 17px Arial, sans-serif; }
      .small { fill: #4f5d75; font: 400 12px Arial, sans-serif; }
      .mono { fill: #4f5d75; font: 500 12px 'SFMono-Regular', Consolas, monospace; }
      .tiny { fill: #7a8399; font: 500 10px 'SFMono-Regular', Consolas, monospace; letter-spacing: .7px; }
      .arrow { fill: none; stroke: #4f5d75; stroke-width: 1.4; marker-end: url(#arrow); }
      .arrow-link { fill: none; stroke: #2e5aa8; stroke-width: 1.4; marker-end: url(#arrow-link); }
      .arrow-soft { fill: none; stroke: rgba(79,93,117,0.72); stroke-width: 1.1; marker-end: url(#arrow); }
      .arrow-dash { fill: none; stroke: rgba(79,93,117,0.70); stroke-width: 1.1; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .arrow-bidi { fill: none; stroke: #2e5aa8; stroke-width: 1.4; marker-start: url(#arrow-link); marker-end: url(#arrow-link); }
      .label-bg { fill: #f5f5f5; }
      .label { fill: #4f5d75; font: 500 11px 'SFMono-Regular', Consolas, monospace; letter-spacing: .5px; }
    </style>
  </defs>

  <rect class="paper" width="1600" height="1040"/>

  <text class="title" x="72" y="64">Online Health Consultation</text>
  <text class="subtitle" x="74" y="92">Architecture overview · current modular monolith implementation</text>

  <!-- Zones -->
  <rect class="zone" x="64" y="128" width="260" height="316" rx="8"/>
  <rect class="zone-label-mask" x="98" y="122" width="124" height="20" rx="4"/>
  <text class="eyebrow" x="160" y="137" text-anchor="middle">USERS</text>

  <rect class="zone" x="380" y="156" width="276" height="220" rx="8"/>
  <rect class="zone-label-mask" x="430" y="150" width="132" height="20" rx="4"/>
  <text class="eyebrow" x="496" y="165" text-anchor="middle">WEB CLIENT</text>

  <rect class="zone" x="720" y="96" width="596" height="596" rx="8"/>
  <rect class="zone-label-mask" x="780" y="90" width="172" height="20" rx="4"/>
  <text class="eyebrow" x="866" y="105" text-anchor="middle">APPLICATION LAYER</text>
  <text class="tiny" x="1212" y="123" text-anchor="middle">Railway</text>

  <rect class="zone" x="720" y="760" width="372" height="206" rx="8"/>
  <rect class="zone-label-mask" x="782" y="754" width="112" height="20" rx="4"/>
  <text class="eyebrow" x="838" y="769" text-anchor="middle">DATA LAYER</text>

