<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Backend Module/Class Diagram</title>
  <desc id="desc">Visual UML-style class/module diagram for the current NestJS backend.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/>
    </marker>
    <marker id="triangle" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="9" markerHeight="8" orient="auto">
      <path d="M 11 5 L 1 1 L 1 9 Z" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    </marker>
    <style>
      .paper{fill:#f5f5f5}.title{fill:#2d3142;font:400 34px Georgia,serif}.subtitle{fill:#4f5d75;font:400 15px Arial,sans-serif}
      .zone{fill:rgba(45,49,66,.02);stroke:rgba(45,49,66,.12);stroke-width:1}.mask{fill:#f5f5f5}
      .zoneText{fill:#7a8399;font:700 11px Arial,sans-serif;letter-spacing:2px}.class{fill:#fff;stroke:#bfc0c0;stroke-width:1.1}
      .focal{fill:rgba(235,108,54,.08);stroke:#eb6c36;stroke-width:1.4}.iface{fill:#fff;stroke:#2d3142;stroke-width:1.2;stroke-dasharray:5 4}
      .name{fill:#2d3142;font:700 15px Arial,sans-serif}.stereo{fill:#7a8399;font:600 10px "SFMono-Regular",Consolas,monospace}
      .member{fill:#4f5d75;font:500 11px "SFMono-Regular",Consolas,monospace}.line{stroke:#d8dbe2;stroke-width:1}
      .edge{fill:none;stroke:#4f5d75;stroke-width:1.2;marker-end:url(#arrow)}.dep{fill:none;stroke:#4f5d75;stroke-width:1.1;stroke-dasharray:5 4;marker-end:url(#arrow)}
      .real{fill:none;stroke:#2d3142;stroke-width:1.1;stroke-dasharray:6 4;marker-end:url(#triangle)}.label{fill:#4f5d75;font:500 10px "SFMono-Regular",Consolas,monospace}.labelBg{fill:#f5f5f5}
      .domain{fill:rgba(45,49,66,.05);stroke:#4f5d75;stroke-width:1}.domainText{fill:#2d3142;font:700 13px Arial,sans-serif}.domainSmall{fill:#4f5d75;font:500 10px "SFMono-Regular",Consolas,monospace}
    </style>
  </defs>
  <rect class="paper" width="1600" height="1040"/>
  <text class="title" x="72" y="62">Backend Module/Class Diagram</text>
  <text class="subtitle" x="74" y="92">NestJS modular monolith · selected controllers, services, gateway, scheduler, providers and domain concepts</text>

  <rect class="zone" x="56" y="132" width="420" height="214" rx="8"/><rect class="mask" x="92" y="126" width="132" height="20" rx="4"/><text class="zoneText" x="158" y="141" text-anchor="middle">IDENTITY</text>
  <rect class="zone" x="508" y="132" width="460" height="214" rx="8"/><rect class="mask" x="544" y="126" width="172" height="20" rx="4"/><text class="zoneText" x="630" y="141" text-anchor="middle">APPOINTMENT / Q&amp;A</text>
  <rect class="zone" x="1000" y="132" width="520" height="214" rx="8"/><rect class="mask" x="1036" y="126" width="158" height="20" rx="4"/><text class="zoneText" x="1115" y="141" text-anchor="middle">CONSULTATION</text>
  <rect class="zone" x="56" y="406" width="704" height="260" rx="8"/><rect class="mask" x="92" y="400" width="152" height="20" rx="4"/><text class="zoneText" x="168" y="415" text-anchor="middle">NOTIFICATION</text>
  <rect class="zone" x="812" y="406" width="708" height="260" rx="8"/><rect class="mask" x="848" y="400" width="150" height="20" rx="4"/><text class="zoneText" x="923" y="415" text-anchor="middle">DATA ACCESS</text>
  <rect class="zone" x="56" y="728" width="1464" height="224" rx="8"/><rect class="mask" x="92" y="722" width="190" height="20" rx="4"/><text class="zoneText" x="187" y="737" text-anchor="middle">SELECTED DOMAIN</text>

  <g id="edges">
    <path class="edge" d="M 250 212 H 304"/><path class="edge" d="M 250 268 H 304"/>
    <path class="edge" d="M 694 212 H 748"/>
    <path class="edge" d="M 1190 212 H 1244"/><path class="edge" d="M 1190 284 H 1244"/>
    <path class="edge" d="M 300 500 H 360"/><path class="edge" d="M 300 574 H 360"/><path class="edge" d="M 548 500 H 608"/>
    <path class="real" d="M 312 632 V 618 H 456"/><path class="real" d="M 456 632 V 618"/><path class="real" d="M 600 632 V 618 H 456"/>
    <path class="edge" d="M 1008 532 H 1060"/>
    <path class="edge" d="M 304 798 H 348"/><path class="edge" d="M 508 798 H 552"/><path class="edge" d="M 712 798 H 756"/><path class="edge" d="M 632 824 V 870 H 756"/><path class="edge" d="M 936 798 H 1060"/>
  </g>

  <g id="identity">
    <rect class="class" x="96" y="174" width="154" height="76" rx="6"/><text class="name" x="173" y="199" text-anchor="middle">AuthController</text><line class="line" x1="96" y1="212" x2="250" y2="212"/><text class="member" x="108" y="233">+ login()</text>
    <rect class="focal" x="304" y="174" width="164" height="110" rx="6"/><text class="name" x="386" y="199" text-anchor="middle">AuthService</text><line class="line" x1="304" y1="212" x2="468" y2="212"/><text class="member" x="316" y="233">+ login()</text><text class="member" x="316" y="250">+ refresh()</text><text class="member" x="316" y="267">+ resetPassword()</text>
    <rect class="class" x="96" y="270" width="154" height="58" rx="6"/><text class="name" x="173" y="297" text-anchor="middle">UsersService</text><line class="line" x1="96" y1="310" x2="250" y2="310"/><text class="member" x="108" y="327">+ createUser()</text>
  </g>

  <g id="appointment">
    <rect class="class" x="548" y="174" width="146" height="76" rx="6"/><text class="name" x="621" y="199" text-anchor="middle">AppointmentController</text><line class="line" x1="548" y1="212" x2="694" y2="212"/><text class="member" x="560" y="233">+ create()</text>
    <rect class="focal" x="748" y="174" width="174" height="110" rx="6"/><text class="name" x="835" y="199" text-anchor="middle">AppointmentService</text><line class="line" x1="748" y1="212" x2="922" y2="212"/><text class="member" x="760" y="233">+ availability()</text><text class="member" x="760" y="250">+ confirm()</text><text class="member" x="760" y="267">+ reschedule()</text>
    <rect class="class" x="548" y="268" width="146" height="58" rx="6"/><text class="name" x="621" y="295" text-anchor="middle">QuestionService</text><line class="line" x1="548" y1="308" x2="694" y2="308"/><text class="member" x="560" y="325">+ answerQuestion()</text>
  </g>

  <g id="consultation">
    <rect class="class" x="1040" y="174" width="150" height="76" rx="6"/><text class="name" x="1115" y="199" text-anchor="middle">ConsultationController</text><line class="line" x1="1040" y1="212" x2="1190" y2="212"/><text class="member" x="1052" y="233">+ startSession()</text>
    <rect class="class" x="1040" y="268" width="150" height="76" rx="6"/><text class="name" x="1115" y="293" text-anchor="middle">ConsultationGateway</text><line class="line" x1="1040" y1="306" x2="1190" y2="306"/><text class="member" x="1052" y="327">+ sendMessage()</text>
    <rect class="focal" x="1244" y="174" width="188" height="130" rx="6"/><text class="name" x="1338" y="199" text-anchor="middle">ConsultationService</text><line class="line" x1="1244" y1="212" x2="1432" y2="212"/><text class="member" x="1256" y="233">+ joinSession()</text><text class="member" x="1256" y="250">+ sendMessage()</text><text class="member" x="1256" y="267">+ createPrescription()</text><text class="member" x="1256" y="284">+ createRating()</text>
  </g>

  <g id="notification">
    <rect class="class" x="96" y="462" width="204" height="76" rx="6"/><text class="name" x="198" y="487" text-anchor="middle">NotificationScheduler</text><line class="line" x1="96" y1="500" x2="300" y2="500"/><text class="member" x="108" y="521">+ onModuleInit()</text>
    <rect class="focal" x="360" y="462" width="188" height="130" rx="6"/><text class="name" x="454" y="487" text-anchor="middle">NotificationService</text><line class="line" x1="360" y1="500" x2="548" y2="500"/><text class="member" x="372" y="521">+ processOutboxBatch()</text><text class="member" x="372" y="538">+ sendReminders()</text><text class="member" x="372" y="555">+ resetNotification()</text>
    <rect class="iface" x="608" y="462" width="120" height="74" rx="6"/><text class="stereo" x="668" y="484" text-anchor="middle">interface</text><text class="name" x="668" y="504" text-anchor="middle">NotificationProvider</text><text class="member" x="620" y="526">+ send()</text>
    <rect class="class" x="168" y="632" width="144" height="48" rx="6"/><text class="name" x="240" y="662" text-anchor="middle">DevelopmentProvider</text>
    <rect class="class" x="384" y="632" width="144" height="48" rx="6"/><text class="name" x="456" y="662" text-anchor="middle">EmailProvider</text>
    <rect class="class" x="576" y="632" width="144" height="48" rx="6"/><text class="name" x="648" y="662" text-anchor="middle">SmsProvider</text>
  </g>

  <g id="data">
    <rect class="focal" x="812" y="486" width="196" height="92" rx="6"/><text class="name" x="910" y="516" text-anchor="middle">PrismaService</text><line class="line" x1="812" y1="532" x2="1008" y2="532"/><text class="member" x="824" y="555">+ onModuleInit()</text>
    <rect class="domain" x="1060" y="486" width="164" height="92" rx="6"/><text class="domainText" x="1142" y="522" text-anchor="middle">PostgreSQL</text><text class="domainSmall" x="1142" y="548" text-anchor="middle">via Prisma ORM</text>
  </g>

  <g id="domain">
    <rect class="domain" x="112" y="772" width="192" height="52" rx="6"/><text class="domainText" x="208" y="803" text-anchor="middle">User</text>
    <rect class="domain" x="348" y="772" width="160" height="52" rx="6"/><text class="domainText" x="428" y="803" text-anchor="middle">Appointment</text>
    <rect class="domain" x="552" y="772" width="160" height="52" rx="6"/><text class="domainText" x="632" y="803" text-anchor="middle">ConsultationSession</text>
    <rect class="domain" x="756" y="772" width="180" height="52" rx="6"/><text class="domainText" x="846" y="803" text-anchor="middle">ConsultationMessage</text>
    <rect class="domain" x="756" y="844" width="180" height="52" rx="6"/><text class="domainText" x="846" y="875" text-anchor="middle">Prescription</text>
    <rect class="domain" x="1060" y="772" width="160" height="52" rx="6"/><text class="domainText" x="1140" y="803" text-anchor="middle">Rating</text>
    <rect class="domain" x="1264" y="772" width="172" height="52" rx="6"/><text class="domainText" x="1350" y="803" text-anchor="middle">OutboxEvent</text>
    <rect class="domain" x="1264" y="844" width="172" height="52" rx="6"/><text class="domainText" x="1350" y="875" text-anchor="middle">NotificationLog</text>
  </g>
  <text class="label" x="72" y="1000">Redrawn from docs/architecture/class-diagram.md. DTOs, helpers, generated Prisma types, and minor controllers intentionally omitted.</text>
</svg>
